<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>茶園巡檢控管中心</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f6f7f4; --card:#ffffff; --ink:#1f2a1f; --quiet:#5f6b5f; --line:#dfe5dc;
          --green:#2f7d32; --amber:#c98a00; --red:#c62828; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  header { padding:16px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { font-size:20px; margin:0; }
  .sub { color:var(--quiet); font-size:13px; }
  main { padding:0 16px 24px; display:grid; gap:16px; grid-template-columns: repeat(12, 1fr); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  .span4 { grid-column: span 4; } .span6 { grid-column: span 6; } .span8 { grid-column: span 8; } .span12 { grid-column: span 12; }
  @media (max-width: 900px) { .span4,.span6,.span8 { grid-column: span 12; } }
  .kpis { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .kpi { border:1px solid var(--line); border-radius:8px; padding:10px; }
  .kpi b { display:block; font-size:24px; }
  .kpi span { color:var(--quiet); font-size:12px; }
  #alert { display:none; background:#fdecea; border:1px solid #f5c2c0; color:var(--red);
           border-radius:10px; padding:10px 14px; grid-column: span 12; font-weight:600; }
  #map { height:300px; border-radius:8px; }
  .grid { display:grid; gap:6px; }
  .cell { border-radius:6px; padding:8px 4px; text-align:center; font-size:13px; color:#fff; }
  .rowlabel { font-size:12px; color:var(--quiet); align-self:center; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  .tablewrap { overflow-x:auto; max-height:320px; }
  select, button { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; }
  button { cursor:pointer; }
  .tag { padding:2px 8px; border-radius:10px; color:#fff; font-size:12px; }
  /* ---- 巡檢車控管 ---- */
  .car { display:grid; grid-template-columns: 1.1fr 1fr; gap:16px; }
  @media (max-width: 900px) { .car { grid-template-columns: 1fr; } }
  .carstate { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .dot { width:12px; height:12px; border-radius:50%; background:#9aa39a; flex:none; }
  .bigstate { font-size:26px; font-weight:700; }
  .carlabel { color:var(--quiet); font-size:14px; min-height:20px; }
  .bar { height:10px; background:#e7ece5; border-radius:5px; overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; width:0; background:var(--green); transition:width .4s; }
  .facts { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-top:10px; }
  .facts div { border:1px solid var(--line); border-radius:8px; padding:8px; }
  .facts b { display:block; font-size:18px; }
  .facts span { color:var(--quiet); font-size:12px; }
  .ctrl { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .ctrl button { border:0; color:#fff; padding:9px 16px; font-weight:600; }
  .ctrl .go { background:var(--green); } .ctrl .stop { background:var(--red); } .ctrl .test { background:#6d4c41; }
  .ctrl button:disabled { opacity:.45; cursor:not-allowed; }
  #cmdNote { font-size:13px; color:var(--amber); min-height:18px; margin-top:6px; }
  .cell.now { outline:3px solid #1565c0; outline-offset:-3px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>南投特產病蟲害巡檢控管中心</h1>
    <div class="sub" id="status">讀取中…</div>
  </div>
  <div>
    <select id="gardenSel"><option value="">全部茶園</option></select>
    <button id="csvBtn">匯出 CSV</button>
  </div>
</header>
<main>
  <div id="alert"></div>
  <section class="card span12">
    <h2>巡檢車控管（<span id="devName"></span>）</h2>
    <div class="car">
      <div>
        <div class="carstate"><span class="dot" id="carDot"></span><span class="bigstate" id="carState">讀取中…</span></div>
        <div class="carlabel" id="carLabel"></div>
        <div class="bar"><i id="carBar"></i></div>
        <div class="sub" id="carProgress">—</div>
        <div class="facts">
          <div><b id="carSpray">0</b><span>本趟噴灑</span></div>
          <div><b id="carRuns">0</b><span>累計巡檢趟數</span></div>
          <div><b id="carSeen">—</b><span>最後回報</span></div>
        </div>
        <div class="ctrl">
          <button class="go" id="btnStart">▶ 開始巡檢</button>
          <button class="stop" id="btnStop">■ 停止巡檢</button>
          <button class="test" id="btnSpray">噴灑測試</button>
        </div>
        <div id="cmdNote"></div>
        <div class="sub" id="linkNote"></div>
      </div>
      <div>
        <h2>本趟巡檢（巡檢車回報）</h2>
        <div id="runGrid"></div>
        <p class="sub">紅＝有噴灑、綠＝已巡檢無噴灑、灰＝尚未到達、藍框＝下一站</p>
      </div>
    </div>
  </section>
  <section class="card span12">
    <div class="kpis">
      <div class="kpi"><b id="kStations">0</b><span>巡檢站次</span></div>
      <div class="kpi"><b id="kDisease">0</b><span>發現病灶</span></div>
      <div class="kpi"><b id="kSpray">0</b><span>定向噴灑</span></div>
      <div class="kpi"><b id="kRate">0%</b><span>噴灑比例（相對全面噴灑）</span></div>
    </div>
  </section>
  <section class="card span6"><h2>茶園地圖（圓越大病灶越多）</h2><div id="map"></div></section>
  <section class="card span6"><h2>茶園內病灶熱力圖（最近一次巡檢）</h2><div id="heat"></div>
    <p class="sub">R＝去程巡檢側、L＝回程巡檢側；顏色：綠＝健康、黃＝輕度、橘＝中度、紅＝重度</p></section>
  <section class="card span12"><h2>病灶數量趨勢（每小時）</h2><div style="height:220px"><canvas id="trend"></canvas></div></section>
  <section class="card span12"><h2>歷史巡檢紀錄（樹莓派辨識結果）</h2><div class="tablewrap"><table id="tbl"></table></div></section>
  <section class="card span12"><h2>巡檢車出勤紀錄</h2><div class="tablewrap"><table id="runTbl"></table></div></section>
</main>
<script>
// ===== 設定 =====
const Q = new URLSearchParams(location.search);
const DB_URL = Q.get("db") || "https://skjhs-anson-default-rtdb.asia-southeast1.firebasedatabase.app";
const DEVICE = Q.get("device") || "mbot2-01";            // 要和 mBot2 程式的 DEVICE 相同
const MODE = Q.get("mode") || "mqtt";                    // 要和 mBot2 程式的 CLOUD_MODE 相同（本車用 "mqtt"）
const MQTT_URL = Q.get("mqtt") || "wss://broker.emqx.io:8084/mqtt";
const TOPIC = Q.get("topic") || "nttea/skjhs/mbot2";     // MQTT 模式才用到，要和 mBot2 程式相同
const REFRESH_MS = 10000;
const ONLINE_SEC = 45;                                   // 超過幾秒沒回報就顯示離線
const DEMO = Q.has("demo");                              // 網址加 ?demo 可用示範資料

const COLORS = { none: "#2f7d32", low: "#c9b400", medium: "#e08a00", high: "#c62828" };
const LEVEL = { none: "健康", low: "輕度", medium: "中度", high: "重度" };
let map, layer, chart, all = [], gardens = {};

function demoData() {
  const now = Date.now(), recs = [];
  const route = [["去程","R",1],["去程","R",2],["去程","R",3],["回程","L",3],["回程","L",2],["回程","L",1]];
  const sick = { "R2": ["anthracnose","medium"], "L3": ["mite_damage","high"] };
  for (let run = 0; run < 3; run++) route.forEach(([trip, side, st], i) => {
    const s = (run === 2 || run === 1 && side + st === "R2") ? sick[side + st] : null;
    recs.push({ time: now - (2 - run) * 3600e3 + i * 8000, garden_id: "MJ-A", garden: "名間松柏嶺A區",
      lat: 23.8341, lng: 120.6452, trip, side, station: st, disease: s ? s[0] : null,
      confidence: s ? 0.82 : 0, severity: s ? s[1] : "none", sprayed: !!s });
  });
  return { detections: recs, gardens: { "MJ-A": { name: "名間松柏嶺A區", lat: 23.8341, lng: 120.6452 } } };
}

async function load() {
  try {
    if (DEMO) {
      const d = demoData(); all = d.detections; gardens = d.gardens;
    } else {
      const [det, gar] = await Promise.all([
        fetch(`${DB_URL}/detections.json`).then(r => r.json()),
        fetch(`${DB_URL}/gardens.json`).then(r => r.json())]);
      all = Object.values(det || {}).sort((a, b) => a.time - b.time);
      gardens = gar || {};
    }
    document.getElementById("status").textContent =
      (DEMO ? "示範資料｜" : "") + "最後更新 " + new Date().toLocaleTimeString("zh-TW");
    fillGardenSelect(); render();
  } catch (e) {
    document.getElementById("status").textContent = "讀取失敗：請確認 DB_URL 與資料庫規則（" + e.message + "）";
  }
}

function fillGardenSelect() {
  const sel = document.getElementById("gardenSel"), cur = sel.value;
  const ids = [...new Set(all.map(r => r.garden_id))];
  sel.innerHTML = '<option value="">全部茶園</option>' +
    ids.map(id => `<option value="${id}">${(all.find(r => r.garden_id === id) || {}).garden || id}</option>`).join("");
  sel.value = ids.includes(cur) ? cur : "";
}

function rows() {
  const g = document.getElementById("gardenSel").value;
  return g ? all.filter(r => r.garden_id === g) : all;
}

function render() {
  const data = rows(), sick = data.filter(r => r.disease);
  document.getElementById("kStations").textContent = data.length;
  document.getElementById("kDisease").textContent = sick.length;
  document.getElementById("kSpray").textContent = data.filter(r => r.sprayed).length;
  document.getElementById("kRate").textContent = data.length ? Math.round(100 * data.filter(r => r.sprayed).length / data.length) + "%" : "0%";

  // 預警：10 分鐘內中度以上
  const recent = sick.filter(r => ["medium", "high"].includes(r.severity) && Date.now() - r.time < 600e3);
  const al = document.getElementById("alert");
  if (recent.length) {
    const r = recent[recent.length - 1];
    al.style.display = "block";
    al.textContent = `⚠ 預警：${r.garden} ${r.side}${r.station}（${r.trip}）發現 ${r.disease}，嚴重程度 ${LEVEL[r.severity]}`;
  } else al.style.display = "none";

  drawMap(data); drawHeat(data); drawTrend(sick); drawTable(data);
}

function drawMap(data) {
  if (!map) {
    map = L.map("map").setView([23.83, 120.65], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  layer.clearLayers();
  const pts = [];
  Object.entries(gardens).forEach(([id, g]) => {
    if (g.lat == null) return;
    const n = data.filter(r => r.garden_id === id && r.disease).length;
    pts.push([g.lat, g.lng]);
    L.circleMarker([g.lat, g.lng], { radius: 8 + n * 3, color: n ? COLORS.high : COLORS.none, fillOpacity: 0.45 })
      .bindPopup(`<b>${g.name}</b><br>病灶 ${n} 筆`).addTo(layer);
  });
  if (pts.length) map.fitBounds(pts, { maxZoom: 15, padding: [30, 30] });
}

function drawHeat(data) {
  const box = document.getElementById("heat");
  if (!data.length) { box.innerHTML = '<p class="sub">尚無資料</p>'; return; }
  // 最近一次巡檢：最後一筆往前 5 分鐘內同一茶園
  const last = data[data.length - 1];
  const run = data.filter(r => r.garden_id === last.garden_id && last.time - r.time < 300e3);
  const n = Math.max(3, ...run.map(r => r.station));
  let html = `<div class="grid" style="grid-template-columns: 40px repeat(${n}, 1fr)">`;
  ["L", "R"].forEach(side => {
    html += `<div class="rowlabel">${side} 側</div>`;
    for (let s = 1; s <= n; s++) {
      const r = run.filter(x => x.side === side && x.station === s).pop();
      const lv = r ? r.severity : null;
      html += `<div class="cell" style="background:${lv ? COLORS[lv] : "#c9d1c6"}">${side}${s}<br>${r ? (r.disease || "健康") : "—"}</div>`;
    }
  });
  box.innerHTML = html + `</div><p class="sub">${last.garden}｜${new Date(last.time).toLocaleString("zh-TW")}</p>`;
}

function drawTrend(sick) {
  const bins = {};
  sick.forEach(r => {
    const d = new Date(r.time);
    const k = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:00`;
    bins[k] = (bins[k] || 0) + 1;
  });
  const labels = Object.keys(bins), values = Object.values(bins);
  if (!chart) {
    chart = new Chart(document.getElementById("trend"), {
      type: "bar", data: { labels, datasets: [{ label: "病灶筆數", data: values, backgroundColor: COLORS.medium }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
  } else { chart.data.labels = labels; chart.data.datasets[0].data = values; chart.update(); }
}

function drawTable(data) {
  const head = "<tr><th>時間</th><th>茶園</th><th>趟次</th><th>位置</th><th>結果</th><th>信心</th><th>嚴重程度</th><th>噴灑</th></tr>";
  const body = [...data].reverse().slice(0, 200).map(r => `<tr>
    <td>${new Date(r.time).toLocaleString("zh-TW")}</td><td>${r.garden}</td><td>${r.trip}</td>
    <td>${r.side}${r.station}</td><td>${r.disease || "健康"}</td><td>${r.disease ? r.confidence : "—"}</td>
    <td><span class="tag" style="background:${COLORS[r.severity] || "#999"}">${LEVEL[r.severity] || r.severity}</span></td>
    <td>${r.sprayed ? "是" : "否"}</td></tr>`).join("");
  document.getElementById("tbl").innerHTML = head + body;
}

document.getElementById("gardenSel").onchange = render;
document.getElementById("csvBtn").onclick = () => {
  const cols = ["time", "garden_id", "garden", "lat", "lng", "trip", "side", "station", "disease", "confidence", "severity", "sprayed"];
  const lines = [cols.join(",")].concat(rows().map(r => cols.map(c =>
    c === "time" ? new Date(r.time).toISOString() : `"${String(r[c] ?? "").replace(/"/g, '""')}"`).join(",")));
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "茶園巡檢紀錄.csv"; a.click();
};

load(); if (!DEMO) setInterval(load, REFRESH_MS);

// =====================================================================
// 巡檢車控管：即時狀態、本趟各站、出勤紀錄、遠端指令
// =====================================================================
const CAR = `${DB_URL}/mbot2/${DEVICE}`;
const STATE_TEXT = { idle: "待命中", scan: "起點掃描 QR", moving: "巡檢中", done: "巡檢完成", stopped: "已中止" };
const BUSY = ["scan", "moving"];
let carStatus = null, carRuns = {}, pendingCmd = null, mq = null, mqRun = {};
document.getElementById("devName").textContent = DEVICE + (MODE === "mqtt" ? "｜MQTT 轉存" : "｜Firebase");

function ago(t) {
  if (!t) return "—";
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  return s < 60 ? s + " 秒前" : s < 3600 ? Math.round(s / 60) + " 分前" : new Date(t).toLocaleString("zh-TW");
}
function isOnline() { return carStatus && carStatus.time && (Date.now() - carStatus.time) / 1000 < ONLINE_SEC; }

function renderCar() {
  const st = carStatus || {}, on = isOnline();
  const busy = on && BUSY.includes(st.state);
  document.getElementById("carDot").style.background = !carStatus ? "#9aa39a" : on ? (busy ? "#1565c0" : "#2f7d32") : "#c62828";
  document.getElementById("carState").textContent = !carStatus ? "尚未收到巡檢車資料" : on ? (STATE_TEXT[st.state] || st.state) : "離線";
  document.getElementById("carLabel").textContent = on ? (st.label || "") : (carStatus ? "最後狀態：" + (STATE_TEXT[st.state] || st.state) + "　" + (st.label || "") : "請確認 mBot2 已上網，且 DEVICE 名稱相同");
  const total = st.total || 6, done = st.done || 0;
  document.getElementById("carBar").style.width = Math.min(100, 100 * done / total) + "%";
  document.getElementById("carProgress").textContent = `已巡檢 ${done} / ${total} 站`;
  document.getElementById("carSpray").textContent = st.sprays || 0;
  document.getElementById("carRuns").textContent = Object.keys(carRuns).length;
  document.getElementById("carSeen").textContent = ago(st.time);
  document.getElementById("btnStart").disabled = !on || busy;
  document.getElementById("btnStop").disabled = !on || !busy;
  document.getElementById("btnSpray").disabled = !on || busy;
  document.getElementById("cmdNote").textContent = pendingCmd ? `已送出「${{start: "開始巡檢", stop: "停止巡檢", spray: "噴灑測試"}[pendingCmd] || pendingCmd}」，等待巡檢車接收（待命時約 3 秒、巡檢中於下一站結束時）…` : "";
  renderRunGrid();
  renderRunTable();
}

function sortedRuns() {
  return Object.entries(carRuns).map(([id, r]) => ({ id, ...r })).sort((a, b) => (a.start || 0) - (b.start || 0));
}

function renderRunGrid() {
  const box = document.getElementById("runGrid");
  const runs = sortedRuns();
  const cur = (carStatus && carStatus.run && carRuns[carStatus.run]) ? { id: carStatus.run, ...carRuns[carStatus.run] } : runs[runs.length - 1];
  if (!cur) { box.innerHTML = '<p class="sub">尚無巡檢紀錄</p>'; return; }
  const n = cur.n || 3, recs = cur.stations || {};
  const nextKey = (carStatus && BUSY.includes(carStatus.state) && carStatus.run === cur.id) ? ((carStatus.label || "").match(/[RL]\d/) || [""])[0] : "";
  let html = `<div class="grid" style="grid-template-columns: 40px repeat(${n}, 1fr)">`;
  ["L", "R"].forEach(side => {
    html += `<div class="rowlabel">${side} 側</div>`;
    for (let s = 1; s <= n; s++) {
      const r = recs[side + s];
      const bg = r ? (r.sprayed ? COLORS.high : COLORS.none) : "#c9d1c6";
      html += `<div class="cell ${nextKey === side + s ? "now" : ""}" style="background:${bg}">${side}${s}<br>${r ? (r.sprayed ? "噴灑" : "無噴灑") : "—"}</div>`;
    }
  });
  const when = cur.start ? new Date(cur.start).toLocaleString("zh-TW") : "";
  box.innerHTML = html + `</div><p class="sub">開始 ${when}${cur.end ? "｜結束 " + new Date(cur.end).toLocaleTimeString("zh-TW") : "｜進行中"}</p>`;
}

function renderRunTable() {
  const head = "<tr><th>開始</th><th>結束</th><th>完成站數</th><th>噴灑次數</th><th>結果</th></tr>";
  const body = sortedRuns().reverse().slice(0, 50).map(r => {
    const recs = r.stations && typeof r.stations === "object" ? r.stations : {};
    const sprays = r.sprays ?? Object.values(recs).filter(x => x.sprayed).length;
    const done = r.done ?? Object.keys(recs).length;
    return `<tr><td>${r.start ? new Date(r.start).toLocaleString("zh-TW") : "—"}</td>
      <td>${r.end ? new Date(r.end).toLocaleTimeString("zh-TW") : "進行中"}</td><td>${done}</td><td>${sprays}</td>
      <td>${r.end ? (r.aborted ? "中止" : "完成") : "—"}</td></tr>`;
  }).join("");
  document.getElementById("runTbl").innerHTML = head + (body || '<tr><td colspan="5" class="sub">尚無紀錄</td></tr>');
}

// ---- 讀取（Firebase 即時串流：status 與 command；runs 在狀態變化時重新讀取） ----
async function loadRuns() {
  try {
    const r = await fetch(`${CAR}/runs.json?orderBy=${encodeURIComponent('"$key"')}&limitToLast=30`).then(x => x.json());
    carRuns = normalizeRuns(r || {});
    renderCar();
  } catch (e) { /* 下次再試 */ }
}
function normalizeRuns(obj) {
  const out = {};
  Object.entries(obj).forEach(([id, r]) => {
    const recs = r.stations && typeof r.stations === "object" ? r.stations : {};
    out[id] = { ...r, n: r.per_side || Math.max(3, ...Object.values(recs).map(x => x.station || 0)), stations: recs };
  });
  return out;
}
function stream(path, onData) {
  let es, retry = 0;
  const open = () => {
    es = new EventSource(`${CAR}/${path}.json`);
    const handle = ev => { retry = 0; onData(JSON.parse(ev.data)); };
    es.addEventListener("put", handle);
    es.addEventListener("patch", handle);
    es.addEventListener("cancel", () => {
      document.getElementById("linkNote").textContent = "Firebase 拒絕讀取 mbot2：請在資料庫規則開放 mbot2 節點";
      es.close();
    });
    es.onerror = () => { if (es.readyState === 2) setTimeout(open, Math.min(30000, 2000 * ++retry)); };
  };
  open();
}
let runsTimer = null;
function applyStatusEvent(p) {
  if (p.path === "/") carStatus = p.data;
  else if (carStatus) carStatus = { ...carStatus, [p.path.slice(1)]: p.data };
  renderCar();
  clearTimeout(runsTimer); runsTimer = setTimeout(loadRuns, 600);
}

// ---- 遠端指令 ----
async function sendCommand(action) {
  pendingCmd = action; renderCar();
  if (DEMO) { setTimeout(() => { pendingCmd = null; demoCommand(action); }, 1200); return; }
  try {
    if (MODE === "mqtt") {
      if (!mq || !mq.connected) throw new Error("MQTT 尚未連線");
      mq.publish(`${TOPIC}/cmd/${DEVICE}`, JSON.stringify({ action }));
      setTimeout(() => { if (pendingCmd === action) { pendingCmd = null; renderCar(); } }, 4000);
    } else {
      const r = await fetch(`${CAR}/command.json`, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, time: { ".sv": "timestamp" } }) });
      if (!r.ok) throw new Error("HTTP " + r.status + "（檢查 mbot2 的 .write 規則）");
    }
  } catch (e) { pendingCmd = null; document.getElementById("linkNote").textContent = "指令送出失敗：" + e.message; renderCar(); }
}
document.getElementById("btnStart").onclick = () => sendCommand("start");
document.getElementById("btnStop").onclick = () => sendCommand("stop");
document.getElementById("btnSpray").onclick = () => sendCommand("spray");

// ---- MQTT 模式：這個網頁負責把 mBot2 的訊息轉存到 Firebase（網頁要一直開著） ----
function fbWrite(method, path, data) {
  return fetch(`${CAR}${path}.json`, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); })
    .catch(e => { document.getElementById("linkNote").textContent = "轉存 Firebase 失敗：" + e.message; });
}
function bridge(msg) {
  if (msg.device && msg.device !== DEVICE) return;
  const d = msg.data || {};
  const fix = o => JSON.parse(JSON.stringify(o));   // 時間欄位保留 {".sv":"timestamp"}，由 Firebase 填入
  if (msg.op === "status") fbWrite("PUT", "/status", fix(d));
  else if (msg.op === "run_start") fbWrite("PUT", `/runs/${d.run}`, fix(d.info));
  else if (msg.op === "station") fbWrite("PATCH", "", { status: fix(d.status), [`runs/${d.run}/stations/${d.key}`]: fix(d.rec) });
  else if (msg.op === "run_end") {
    const patch = { status: fix(d.status) };
    Object.entries(d.end || {}).forEach(([k, v]) => patch[`runs/${d.run}/${k}`] = v);
    fbWrite("PATCH", "", patch);
  }
}
function startMqttBridge() {
  const s = document.createElement("script");
  s.src = "https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js";
  s.onerror = () => { document.getElementById("linkNote").textContent = "mqtt.js 載入失敗，請確認電腦有網路"; };
  s.onload = () => {
    mq = mqtt.connect(MQTT_URL, { clientId: "web-" + Math.random().toString(16).slice(2, 10), reconnectPeriod: 3000 });
    mq.on("connect", () => {
      mq.subscribe(`${TOPIC}/up`);
      document.getElementById("linkNote").textContent = "MQTT 轉存中：這個網頁要保持開著，巡檢資料才會寫進 Firebase";
    });
    mq.on("message", (t, payload) => {
      try { bridge(JSON.parse(new TextDecoder().decode(payload))); } catch (e) { console.warn(e); }
    });
    mq.on("error", e => { document.getElementById("linkNote").textContent = "MQTT 錯誤：" + e.message; });
  };
  document.head.appendChild(s);
}

// ---- 示範模式 ----
let demoTimer = null;
function demoInit() {
  const now = Date.now();
  carRuns = normalizeRuns({ "-Demo1": { start: now - 3600e3, end: now - 3540e3, done: 6, sprays: 2, aborted: false, stations: {
    R1: { sprayed: false, station: 1 }, R2: { sprayed: true, station: 2 }, R3: { sprayed: false, station: 3 },
    L3: { sprayed: true, station: 3 }, L2: { sprayed: false, station: 2 }, L1: { sprayed: false, station: 1 } } } });
  carStatus = { state: "idle", label: "待命", done: 0, total: 6, sprays: 0, run: null, time: now };
  setInterval(() => { carStatus.time = Date.now(); renderCar(); }, 5000);
  renderCar();
}
function demoCommand(action) {
  if (action === "start") {
    const id = "-Demo" + Date.now(), route = [["R", 1], ["R", 2], ["R", 3], ["L", 3], ["L", 2], ["L", 1]];
    carRuns[id] = { start: Date.now(), n: 3, stations: {} };
    carStatus = { state: "scan", label: "起點掃描 QR", done: 0, total: 6, sprays: 0, run: id, time: Date.now() };
    let i = 0; renderCar();
    demoTimer = setInterval(() => {
      const [side, st] = route[i], sprayed = side + st === "R2" || side + st === "L3";
      carRuns[id].stations[side + st] = { sprayed, station: st };
      carStatus = { ...carStatus, state: "moving", done: i + 1, sprays: carStatus.sprays + (sprayed ? 1 : 0),
        label: i < 5 ? `前往 ${route[i + 1].join("")}` : "返回起點", time: Date.now() };
      if (++i === 6) {
        clearInterval(demoTimer);
        Object.assign(carRuns[id], { end: Date.now(), done: 6, sprays: carStatus.sprays, aborted: false });
        carStatus = { ...carStatus, state: "done", label: "巡檢完成" };
      }
      renderCar();
    }, 2500);
  } else if (action === "stop" && demoTimer) {
    clearInterval(demoTimer);
    const r = carRuns[carStatus.run];
    Object.assign(r, { end: Date.now(), done: carStatus.done, sprays: carStatus.sprays, aborted: true });
    carStatus = { ...carStatus, state: "stopped", label: "已中止", time: Date.now() };
    renderCar();
  }
}

if (DEMO) demoInit();
else {
  stream("status", applyStatusEvent);
  stream("command", p => { if (p.path === "/") { pendingCmd = p.data ? p.data.action : null; renderCar(); } });
  loadRuns();
  if (MODE === "mqtt") startMqttBridge();
  setInterval(renderCar, 5000);   // 更新「幾秒前」與離線判斷
}
</script>
